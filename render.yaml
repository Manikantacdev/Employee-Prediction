services:
  - type: web
    name: employee-prediction
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd Flask && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production